project_name: superr_pressure
project_version: phase3
data:
  raw_dir: data/raw
  interim_dir: data/interim
  audit_dir: outputs/audit
  deliveries_file: data/interim/deliveries.parquet
  # Provider's "other" extras rows each carry one extra run and treating them
  # as no-balls is required for normal innings to reconcile to <=120 legal balls.
  infer_other_as_no_ball: true
  infer_untyped_extras1_as_no_ball: true
  # extras_2_runs is retained in team totals but not charged to bowlers in the
  # primary output; true is a predeclared sensitivity alternative.
  bowler_charged_extras2_assumption: false
  result_dls_pattern: "\\bD/?L\\b|DLS|duckworth"
  bowl_speed_min_valid: 0
  bowl_speed_max_valid: 160
  bowler_credited_dismissals:
    - Bowled
    - Caught
    - LBW
    - Stump
    - Hit Wicket
competitions:
  include_other_t20_in_primary_rankings: false
  ipl_name_prefix: "IPL "
  t20i_format: T20I
validation:
  result_margin_exact_match_threshold: 0.99
  expected_nonfinal_over_legal_balls: 6
  known_over_structure_exception_count: 5
  known_result_margin_exception_match_ids:
    - 20190
phase2:
  regular_innings_overs: 20
  super_over_balls: 6
  exclude_dls_matches_from_primary_scoring: true
  cold_start_par_runs_per_over: 8.0
  high_pressure_quantile: 0.75
  chase_weights:
    rate_strain: 0.60
    wicket_strain: 0.25
    time_strain: 0.15
  first_innings_weights:
    score_deficit: 0.55
    wickets_lost: 0.30
    phase: 0.15
phase3:
  train_pools:
    - IPL
    - T20I
  primary_ranking_pool: IPL
  include_other_t20_in_primary_rankings: false
  random_seed: 2027
  thread_count: 4
  catboost_iterations: 120
  catboost_depth: 6
  catboost_learning_rate: 0.05
  ranking_eligibility:
    min_pressure_matches: 10
    min_pressure_weighted_balls: 100
  candidate_eligibility:
    min_pressure_matches: 3
    min_pressure_weighted_balls: 30
  lower_posterior_quantile: 0.20
  shrinkage_method: method_of_moments_role_prior
  uncertainty_method: match_cluster_ratio_variance
  minimum_prior_variance: 0.01
  uplift_min_pressure_weighted_balls: 50
  max_examples_per_fold: 30000
  validation_last_seasons: 3
  selection_validation_last_seasons: 3
phase4:
  primary_pool: IPL
  cross_format_view: average_role_standardized_posterior_z_for_players_in_both_pools
  rank_stability_metrics:
    - spearman_rank_correlation
    - top10_overlap
    - top10_jaccard
  sensitivity_variants:
    - primary_selected_continuous
    - baseline_only_continuous
    - binary_high_pressure
    - chase_only
    - recency_half_life_3y
    - eligibility_relaxed_3m_30b
    - eligibility_strict_15m_200b
    - cross_format_standardized
